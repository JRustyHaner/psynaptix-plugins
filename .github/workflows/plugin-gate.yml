name: Psynaptix Plugin Gate

# CANONICAL GATE WORKFLOW (issue #484) — do not modify.
# The Psynaptix service verifies THIS file's hash at the pinned SHA before
# trusting the gate result, and verifies the sigstore attestation this
# workflow emits. A modified workflow is rejected as 'workflow mismatch'.

on:
  push:
  pull_request:

permissions:
  id-token: write # sigstore keyless signing (attest-build-provenance)
  contents: read
  attestations: write

env:
  # canonical psynaptix-plugins commit whose gate/sanitizer.ts runs the scan.
  # The canonical repo is PUBLIC — the fetch works unauthenticated (the
  # psynaptix service repo itself is private, so it cannot host the fetch).
  CANONICAL_SANITIZER_SHA: 15ab45d2a3064804ec2cd2452e4053e6598bfbec

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (scripts blocked — supply-chain hardening)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run plugin tests (all plugins + examples)
        id: test
        run: npm test

      - name: Sanitizer scan (canonical sanitizer from psynaptix @ ${{ env.PSYNAPTIX_SANITIZER_SHA }})
        id: sanitize
        run: |
          curl -fsSL "https://raw.githubusercontent.com/JRustyHaner/psynaptix-plugins/${{ env.CANONICAL_SANITIZER_SHA }}/gate/sanitizer.ts" -o /tmp/sanitizer.ts
          node --experimental-strip-types --no-warnings -e "
            import('/tmp/sanitizer.ts').then(async ({ sanitizePluginDir }) => {
              const fs = await import('node:fs');
              const dirs = ['plugins', 'examples'];
              let bad = 0;
              for (const dir of dirs) {
                for (const name of fs.readdirSync(dir)) {
                  const entry = dir + '/' + name + '/entry.js';
                  if (!fs.existsSync(entry)) continue;
                  const files = { 'entry.js': await fs.promises.readFile(entry, 'utf8') };
                  const r = sanitizePluginDir(files, 'entry.js');
                  if (!r.ok) {
                    bad++;
                    console.error('SANITIZER FLAGGED', entry, JSON.stringify(r.violations));
                  } else {
                    console.log('sanitizer clean:', entry);
                  }
                }
              }
              if (bad > 0) process.exit(1);
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Digest the gated manifests (attestation subject — deterministic per SHA)
        id: digest
        run: |
          cat plugins/*/manifest.json examples/*/manifest.json 2>/dev/null | sha256sum | cut -d' ' -f1 > /tmp/manifest-digest
          echo "digest=$(cat /tmp/manifest-digest)" >> "$GITHUB_OUTPUT"

      - name: Attest the gate result (sigstore — unforgeable)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ github.repository }}
          subject-digest: sha256:${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Post gate check run
        if: always()
        run: |
          conclusion=success
          [ "${{ job.status }}" = "success" ] || conclusion=failure
          cat > /tmp/check.json <<JSON
          {"name":"Psynaptix Plugin Gate","head_sha":"${{ github.sha }}","status":"completed","conclusion":"$conclusion","output":{"title":"Plugin gate $conclusion","summary":"npm test + canonical sanitizer on ${{ github.sha }}."}}
          JSON
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d @/tmp/check.json
