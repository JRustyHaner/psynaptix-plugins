name: Psynaptix Plugin Gate

# CANONICAL GATE WORKFLOW (issue #484) — do not modify.
# The Psynaptix service verifies THIS file's hash at the pinned SHA before
# trusting the gate result, and verifies the sigstore attestation this
# workflow emits. A modified workflow is rejected as 'workflow mismatch'.

on:
  push:
  pull_request:

permissions:
  id-token: write # sigstore keyless signing (attest-build-provenance)
  contents: read
  attestations: write

env:
  # psynaptix commit whose src/plugin/sanitizer.ts runs the static scan.
  PSYNAPTIX_SANITIZER_SHA: 1ff82af

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (scripts blocked — supply-chain hardening)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run plugin tests (all plugins + examples)
        id: test
        run: npm test

      - name: Sanitizer scan (canonical sanitizer from psynaptix @ ${{ env.PSYNAPTIX_SANITIZER_SHA }})
        id: sanitize
        run: |
          curl -fsSL "https://raw.githubusercontent.com/JRustyHaner/psynaptix/${{ env.PSYNAPTIX_SANITIZER_SHA }}/src/plugin/sanitizer.ts" -o /tmp/sanitizer.ts
          node --experimental-strip-types --no-warnings -e "
            import('/tmp/sanitizer.ts').then(async ({ sanitizePluginDir }) => {
              const fs = await import('node:fs');
              const dirs = ['plugins', 'examples'];
              let bad = 0;
              for (const dir of dirs) {
                for (const name of fs.readdirSync(dir)) {
                  const entry = dir + '/' + name + '/entry.js';
                  if (!fs.existsSync(entry)) continue;
                  const files = { 'entry.js': await fs.promises.readFile(entry, 'utf8') };
                  const r = sanitizePluginDir(files, 'entry.js');
                  if (!r.ok) {
                    bad++;
                    console.error('SANITIZER FLAGGED', entry, JSON.stringify(r.violations));
                  } else {
                    console.log('sanitizer clean:', entry);
                  }
                }
              }
              if (bad > 0) process.exit(1);
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Attest the gate result (sigstore — unforgeable)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ github.repository }}
          subject-digest: sha256:${{ github.sha }}
          push-to-registry: false

      - name: Post gate check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const test = steps['test'] ?? {};
            const sanitize = steps['sanitize'] ?? {};
            const passed = test.conclusion === 'success' && sanitize.conclusion === 'success';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Psynaptix Plugin Gate',
              head_sha: context.sha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: {
                title: passed ? 'Plugin gate passed' : 'Plugin gate failed',
                summary: passed
                  ? 'npm test passed + sanitizer clean.'
                  : 'npm test and/or the injection sanitizer failed — see the job logs.',
              },
            });
